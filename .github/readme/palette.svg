<g class="c" style="animation-delay:0.32s"><rect x="480" y="0" width="120" height="120" fill="#C4C7F2"/><text x="490" y="104" class="m" font-size="13" fill="#020D2F">#C4C7F2</text><text x="490" y="146" class="s" font-size="13" fill="#020D2F">Vodka</text><text x="490" y="166" class="s" font-size="12" fill="#502A50">text on the pool</text></g>

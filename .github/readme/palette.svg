<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190">
<style>.s{font-family:Geist,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:"Geist Mono",ui-monospace,Menlo,monospace}@keyframes up{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}g.c{animation:up .7s cubic-bezier(.2,.9,.2,1) both}</style>
<rect width="100%" height="190" fill="#F6F5FC"/>
<g class="c" style="animation-delay:0.00s"><rect x="0" y="0" width="120" height="120" fill="#020D2F"/><text x="10" y="104" class="m" font-size="13" fill="#FCFCFE">#020D2F</text><text x="10" y="146" class="s" font-size="13" fill="#020D2F">Cetacean Blue</text><text x="10" y="166" class="s" font-size="12" fill="#502A50">pool, headings</text></g>
<g class="c" style="animation-delay:0.08s"><rect x="120" y="0" width="120" height="120" fill="#032C7D"/><text x="130" y="104" class="m" font-size="13" fill="#FCFCFE">#032C7D</text><text x="130" y="146" class="s" font-size="13" fill="#020D2F">Catalina Blue</text><text x="130" y="166" class="s" font-size="12" fill="#502A50">pool depth</text></g>
